[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skai"
version = "1.0.0"
description = "SK AI — Extensible Local-First Multimodal AI Ecosystem (LLM, Code, Vision, Music, Image, Video, Audio, Speech, Android & Windows Generators)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "SK AI Architecture Team" }
]
dependencies = []

[project.optional-dependencies]
torch = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
]
full = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "pytest>=7.4.0",
]

[project.scripts]
skai = "skai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
