name: SK AI CI
on:
  push:
    branches: [main, production-1.3t]
  pull_request:
jobs:
  audit-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python scripts/audit_1_3t.py
      - run: pytest -q
